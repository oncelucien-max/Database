<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DB Admin{% endblock %}</title>
  <style>
    :root { color-scheme: light; --ink: #18212b; --muted: #687581; --line: #dfe5e8; --paper: #ffffff; --wash: #f4f7f6; --accent: #0f766e; --danger: #b42318; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--wash); color: var(--ink); font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .topbar { background: var(--ink); color: #fff; }
    .topbar-inner, main { width: min(1180px, calc(100% - 32px)); margin: auto; }
    .topbar-inner { min-height: 68px; display: flex; align-items: center; justify-content: space-between; }
    .brand { color: #fff; font-size: 1.1rem; font-weight: 750; letter-spacing: .02em; }
    .brand:hover { text-decoration: none; }
    main { padding: 42px 0 64px; }
    .eyebrow { color: var(--accent); font-size: .75rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    h1, h2 { margin: 4px 0 8px; line-height: 1.15; }
    h1 { font-size: clamp(1.8rem, 4vw, 2.7rem); }
    h2 { font-size: 1.1rem; }
    .intro { color: var(--muted); margin: 0 0 28px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
    .card, .panel { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; }
    .card { display: block; padding: 20px; color: var(--ink); transition: transform .15s ease, border-color .15s ease; }
    .card:hover { border-color: var(--accent); text-decoration: none; transform: translateY(-2px); }
    .card strong { display: block; font-size: 1.05rem; margin-bottom: 5px; }
    .meta { color: var(--muted); font-size: .88rem; }
    .panel { overflow: hidden; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 22px; border-bottom: 1px solid var(--line); }
    .table-wrap { overflow-x: auto; }
    table { border-collapse: collapse; min-width: 680px; width: 100%; }
    th, td { border-bottom: 1px solid var(--line); padding: 12px 14px; text-align: left; vertical-align: top; }
    th { background: #f8faf9; color: var(--muted); font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; }
    tr:last-child td { border-bottom: 0; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .button, button { border: 0; border-radius: 5px; cursor: pointer; font: inherit; padding: 8px 13px; }
    .button { background: var(--accent); color: #fff; display: inline-block; }
    .button:hover { background: #115e59; text-decoration: none; }
    .button.secondary { background: #e8efed; color: var(--ink); }
    .button.danger, button.danger { background: #fff0ee; color: var(--danger); }
    form.inline { display: inline; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; padding: 22px; }
    label { display: grid; gap: 5px; color: var(--muted); font-size: .82rem; font-weight: 700; }
    input { border: 1px solid var(--line); border-radius: 5px; font: inherit; min-width: 0; padding: 9px 10px; }
    input:focus { border-color: var(--accent); outline: 2px solid #b7e4df; }
    .empty { color: var(--muted); padding: 28px 22px; }
    .pagination { display: flex; justify-content: space-between; padding: 16px 22px; border-top: 1px solid var(--line); }
    @media (max-width: 600px) { main { padding-top: 28px; } .panel-head { align-items: flex-start; flex-direction: column; } .topbar-inner, main { width: min(100% - 24px, 1180px); } }
  </style>
</head>
<body>
  <header class="topbar"><div class="topbar-inner"><a class="brand" href="{{ url_for('index') }}">DB Admin</a><span>PostgreSQL</span></div></header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
